<body>
<div id="app"><div class="splash"><span class="logo-ball"></span><div class="shadow"></div>Loading PicklePOS...<noscript><p>Please turn on JavaScript, or open the app with Start POS.bat.</p></noscript></div></div>
<div id="modals"></div>
<div id="toasts"></div>
<script>
// Show the business logo and name while the app loads (saved by the app the last time it ran)
try {
  var b = JSON.parse(localStorage.getItem('pp-brand') || 'null');
  if (b && b.name) document.title = b.name + ' - PicklePOS';
  if (b && b.icon) {
    document.querySelector('link[rel=icon]').href = b.icon;
    document.querySelector('.splash .logo-ball').outerHTML = '<img class="biz-logo splash-logo" src="' + b.icon + '" alt="">';
  }
} catch (e) { /* first run or storage blocked */ }
</script>
<script src="version.js"></script>
<script src="js/util.js"></script>

</body>
